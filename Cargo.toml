# =============================================================================
#  R E P S   ·   lint-lang
# =============================================================================
[package]
name    = "lint-lang"
version = "0.2.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Lint framework: configurable rules over an AST that emit diagnostics."

# Keywords (5 max)
keywords = ["compiler", "language", "lint", "analysis", "diagnostics"]

# Categories
categories = ["development-tools", "compilers"]

# Links
homepage      = "https://github.com/jamesgober/lint-lang"
repository    = "https://github.com/jamesgober/lint-lang"
documentation = "https://docs.rs/lint-lang"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "lint_lang"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
# Links the standard library. The crate needs only `alloc`; disabling this builds
# lint-lang under `#![no_std]` with no loss of function.
std = ["ast-lang/std", "diag-lang/std"]
# `Serialize`/`Deserialize` for `Level`, so rule levels can be read from a
# configuration file.
serde = ["dep:serde"]


# DEPENDENCIES
# #################################
[dependencies]
# The tree model lints run over: the `Node` trait, arena storage with typed `Id`
# handles, and the iterative depth-first walk every lint run rides on.
ast-lang = { version = "1", default-features = false }
# The output format: every finding is a `diag-lang` diagnostic, so a lint result
# renders through the same caret renderer as every other compiler error.
diag-lang = { version = "1", default-features = false }
serde = { version = "1", optional = true, default-features = false, features = ["derive", "alloc"] }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"
# Exercises the `serde` feature's `Level` derivations in tests/serde.rs.
serde_json = "1"

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
